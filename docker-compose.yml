services:
  postgres:
    image: postgres:16-alpine
    container_name: twstock-agents-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: twstock_agents
      POSTGRES_USER: twstock
      POSTGRES_PASSWORD: twstock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twstock -d twstock_agents"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - twstock-postgres-data:/var/lib/postgresql/data

  arithmetic-mcp-fastmcp:
    build:
      context: ./mcp-arithmetic
    image: arithmetic-mcp-fastmcp:latest
    container_name: arithmetic-mcp-fastmcp
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"

  twstock-mcp-fastmcp:
    build:
      context: ./mcp-twstock
    image: twstock-mcp-fastmcp:latest
    container_name: twstock-mcp-fastmcp
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"

  chat-api:
    build:
      context: ./backend
    image: arithmetic-mcp-chat-api:latest
    container_name: arithmetic-mcp-chat-api
    depends_on:
      postgres:
        condition: service_healthy
      arithmetic-mcp-fastmcp:
        condition: service_started
      twstock-mcp-fastmcp:
        condition: service_started
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      FINANCIAL_ANALYSIS_MODEL: ${FINANCIAL_ANALYSIS_MODEL:-gpt-5-mini}
      FINANCIAL_ANALYSIS_WEB_CONTEXT: ${FINANCIAL_ANALYSIS_WEB_CONTEXT:-medium}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      OPENAI_AGENTS_TRACING_ENABLED: ${OPENAI_AGENTS_TRACING_ENABLED:-true}
      OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: ${OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://twstock:twstock@postgres:5432/twstock_agents}
      SKILLS_DB_AUTO_INIT: ${SKILLS_DB_AUTO_INIT:-true}
      MCP_HTTP_URL: http://arithmetic-mcp-fastmcp:8080/mcp
      TWSTOCK_MCP_HTTP_URL: http://twstock-mcp-fastmcp:8081/mcp
      CORS_ALLOW_ORIGINS: "*"

  chat-web:
    build:
      context: ./frontend
    image: arithmetic-mcp-chat-web:latest
    container_name: arithmetic-mcp-chat-web
    depends_on:
      - chat-api
    ports:
      - "5173:5173"

volumes:
  twstock-postgres-data:
